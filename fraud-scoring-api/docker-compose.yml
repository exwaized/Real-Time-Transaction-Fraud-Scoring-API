services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models
      # Auth fails closed (503) unless at least one of these is set
      - FRAUD_API_KEY=${FRAUD_API_KEY:-}
      - FRAUD_API_KEYS=${FRAUD_API_KEYS:-}
      - FRAUD_RATE_LIMITS=${FRAUD_RATE_LIMITS:-}
      - CARD_HASH_SALT=${CARD_HASH_SALT:-}
      - ENV=${ENV:-development}
      - CHALLENGER_RATIO=0.10
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Defaults to the sidecar below — adjudicator.py still fails open
      # (falls back to the raw threshold decision) unless JEV_API_KEY is
      # also set, so this alone doesn't turn review on.
      - JEV_ENDPOINT=${JEV_ENDPOINT:-http://semif-sidecar:8600/decide}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - REVIEW_MARGIN=${REVIEW_MARGIN:-0.05}
      # Shared divergence log across all --workers of this container (and any
      # other replica pointed at the same Redis) — see app/services/divergence.py.
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # scorer.py resolves models relative to itself (app/services/scorer.py →
      # parent.parent/models), i.e. /app/app/models inside the container — not
      # /app/models. MODEL_DIR env var below is not actually read by scorer.py.
      - ./app/models:/app/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - semif-sidecar
    networks:
      - fraud-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - fraud-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - fraud-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.2
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - fraud-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # Adjudicator sidecar for borderline scores (app/services/adjudicator.py) —
  # Laya, a small CPU-only decision model (see semif_sidecar/main.py). No GPU
  # needed and no profile gate: it's cheap enough to run by default.
  semif-sidecar:
    build:
      context: ./semif_sidecar
      dockerfile: Dockerfile
    container_name: semif-sidecar
    expose:
      - "8600"
    environment:
      - SEMIF_API_KEY=${JEV_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8600/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s   # first call downloads the checkpoint from HF hub
    networks:
      - fraud-net
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: mlflow
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      bash -c "pip install mlflow -q && mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns"
    volumes:
      - ./mlruns:/mlruns
    networks:
      - fraud-net
    restart: unless-stopped

networks:
  fraud-net:
    driver: bridge

volumes:
  grafana-data:
  redis-data:
